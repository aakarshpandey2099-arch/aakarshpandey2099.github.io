<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">MyPortfolio</a>
            <nav>
                <a href="index.html">Home</a>
                <a href="education.html">Education</a>

                <a href="contact.html" class="active">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <h1>Contact Me</h1>
        <p class="subtitle">Feel free to reach out directly or send a message.</p>

        <div class="grid">
            <div>
                <form action="#" method="POST">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Your Name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Your Email" required>

                    <label for="message">Message</label>
                    <textarea id="message" rows="4" placeholder="Your Message" required></textarea>

                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>

            <div class="card">
                <h2>Direct Links</h2>
                <p>Email: <a href="mailto:email@example.com" class="highlight">aakarsh@example.com</a></p>
                <p>GitHub: <a href="https://github.com/aakarshpandey2099-arch" target="_blank" class="highlight">github.com/aakarshpandey2099</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio | Hosted on GitHub Pages</p>
    </footer>

</body>
</html>
